[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtfserver"
version = "0.1.0"
description = "WTFServer / whatami: evidence-backed functional portrait of an unfamiliar server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
whatami = "wtfserver.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
